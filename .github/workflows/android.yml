name: Android build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Run checks and assemble APKs
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nexora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nexora-unsigned-release-apk
          path: app/build/outputs/apk/release/*-unsigned.apk

      - name: Run D-pad smoke test on Android TV
        timeout-minutes: 12
        run: |
          sudo chmod a+rw /dev/kvm
          sdk_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          image='system-images;android-34;android-tv;x86'
          "$sdk_tools/sdkmanager" 'emulator' "$image"
          echo no | "$sdk_tools/avdmanager" create avd --force --name nexora-tv-test --package "$image"
          "$ANDROID_HOME/emulator/emulator" -avd nexora-tv-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/nexora-emulator.log" 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          timeout 210 sh -c 'adb wait-for-device; until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'
          adb shell input keyevent 82
          gradle :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nexora-emulator-diagnostics
          path: |
            ${{ runner.temp }}/nexora-emulator.log
            app/build/reports/androidTests/
